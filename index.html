<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>衛生紙比價神器 V2.1</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Microsoft JhengHei",sans-serif;
  background:#f5f7fa;
  color:#222;
}

.container{
  max-width:650px;
  margin:auto;
  padding:25px 16px 60px;
}

h1{
  font-size:30px;
  margin:0 0 10px;
}

.subtitle{
  color:#777;
  font-size:17px;
  line-height:1.6;
  margin-bottom:25px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:22px 20px;
  margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

h2{
  margin:0 0 20px;
  font-size:24px;
}

label{
  display:block;
  font-weight:bold;
  font-size:17px;
  margin:17px 0 8px;
}

input,select{
  width:100%;
  min-height:55px;
  padding:13px;
  font-size:17px;
  border:1px solid #ccc;
  border-radius:14px;
  background:white;
}

.compare-btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:19px;
  background:#1976d2;
  color:white;
  font-size:23px;
  font-weight:bold;
  cursor:pointer;
}

.reset-btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  margin-top:15px;
  background:#666;
  color:white;
  font-size:18px;
  font-weight:bold;
}

#result{
  display:none;
  margin-top:22px;
}

.winner{
  color:#16823b;
  font-size:23px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:15px;
}

.result-item{
  padding:17px 0;
  border-bottom:1px solid #eee;
  line-height:1.8;
}

.rank{
  font-size:20px;
  font-weight:bold;
}

.error{
  background:#fff3f3;
  color:#b00020;
  padding:15px;
  border-radius:12px;
  font-weight:bold;
  line-height:1.6;
}

.note{
  color:#777;
  font-size:14px;
  line-height:1.7;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🧻 衛生紙比價神器 V2.1</h1>

<div class="subtitle">
不同品牌、通路、抽數、包數、層數，一次換算比較
</div>


<!-- 商品 A -->

<div class="card">

<h2>商品 A</h2>

<label>品牌</label>
<select id="brandA">
<option value="">請選擇品牌</option>
<option>舒潔</option>
<option>五月花</option>
<option>春風</option>
<option>得意</option>
<option>倍潔雅</option>
<option>柔情</option>
<option>蒲公英</option>
<option>唯潔雅</option>
<option>可麗舒</option>
<option>Tempo 得寶</option>
<option>家樂福</option>
<option>全聯自有品牌</option>
<option>其他品牌</option>
</select>

<label>購買通路</label>
<select id="storeA">
<option value="">請選擇通路</option>
<option>全聯</option>
<option>大全聯</option>
<option>家樂福</option>
<option>7-ELEVEN</option>
<option>全家</option>
<option>萊爾富</option>
<option>OK超商</option>
<option>寶雅</option>
<option>屈臣氏</option>
<option>康是美</option>
<option>好市多 Costco</option>
<option>momo</option>
<option>蝦皮</option>
<option>PChome</option>
<option>其他通路</option>
</select>

<label>售價（元）</label>
<input id="priceA" type="number" inputmode="decimal" min="0.01" placeholder="例如：299">

<label>每包抽數</label>
<input id="sheetsA" type="number" inputmode="numeric" min="1" placeholder="例如：100">

<label>一串幾包</label>
<input id="packsA" type="number" inputmode="numeric" min="1" placeholder="例如：12">

<label>層數</label>
<select id="layersA">
<option value="">請選擇層數</option>
<option value="2">2 層</option>
<option value="3">3 層</option>
<option value="4">4 層</option>
<option value="5">5 層</option>
<option value="6">6 層</option>
</select>

</div>


<!-- 商品 B -->

<div class="card">

<h2>商品 B</h2>

<label>品牌</label>
<select id="brandB">
<option value="">請選擇品牌</option>
<option>舒潔</option>
<option>五月花</option>
<option>春風</option>
<option>得意</option>
<option>倍潔雅</option>
<option>柔情</option>
<option>蒲公英</option>
<option>唯潔雅</option>
<option>可麗舒</option>
<option>Tempo 得寶</option>
<option>家樂福</option>
<option>全聯自有品牌</option>
<option>其他品牌</option>
</select>

<label>購買通路</label>
<select id="storeB">
<option value="">請選擇通路</option>
<option>全聯</option>
<option>大全聯</option>
<option>家樂福</option>
<option>7-ELEVEN</option>
<option>全家</option>
<option>萊爾富</option>
<option>OK超商</option>
<option>寶雅</option>
<option>屈臣氏</option>
<option>康是美</option>
<option>好市多 Costco</option>
<option>momo</option>
<option>蝦皮</option>
<option>PChome</option>
<option>其他通路</option>
</select>

<label>售價（元）</label>
<input id="priceB" type="number" inputmode="decimal" min="0.01" placeholder="例如：259">

<label>每包抽數</label>
<input id="sheetsB" type="number" inputmode="numeric" min="1" placeholder="例如：110">

<label>一串幾包</label>
<input id="packsB" type="number" inputmode="numeric" min="1" placeholder="例如：10">

<label>層數</label>
<select id="layersB">
<option value="">請選擇層數</option>
<option value="2">2 層</option>
<option value="3">3 層</option>
<option value="4">4 層</option>
<option value="5">5 層</option>
<option value="6">6 層</option>
</select>

</div>


<!-- 商品 C -->

<div class="card">

<h2>商品 C</h2>

<label>品牌</label>
<select id="brandC">
<option value="">請選擇品牌</option>
<option>舒潔</option>
<option>五月花</option>
<option>春風</option>
<option>得意</option>
<option>倍潔雅</option>
<option>柔情</option>
<option>蒲公英</option>
<option>唯潔雅</option>
<option>可麗舒</option>
<option>Tempo 得寶</option>
<option>家樂福</option>
<option>全聯自有品牌</option>
<option>其他品牌</option>
</select>

<label>購買通路</label>
<select id="storeC">
<option value="">請選擇通路</option>
<option>全聯</option>
<option>大全聯</option>
<option>家樂福</option>
<option>7-ELEVEN</option>
<option>全家</option>
<option>萊爾富</option>
<option>OK超商</option>
<option>寶雅</option>
<option>屈臣氏</option>
<option>康是美</option>
<option>好市多 Costco</option>
<option>momo</option>
<option>蝦皮</option>
<option>PChome</option>
<option>其他通路</option>
</select>

<label>售價（元）</label>
<input id="priceC" type="number" inputmode="decimal" min="0.01" placeholder="例如：209">

<label>每包抽數</label>
<input id="sheetsC" type="number" inputmode="numeric" min="1" placeholder="例如：110">

<label>一串幾包</label>
<input id="packsC" type="number" inputmode="numeric" min="1" placeholder="例如：12">

<label>層數</label>
<select id="layersC">
<option value="">請選擇層數</option>
<option value="2">2 層</option>
<option value="3">3 層</option>
<option value="4">4 層</option>
<option value="5">5 層</option>
<option value="6">6 層</option>
</select>

</div>


<button type="button" id="compareBtn" class="compare-btn">
開始比價
</button>

<div id="result" class="card"></div>

<button type="button" id="resetBtn" class="reset-btn">
清除全部資料
</button>

<div class="note">
※ 主要排名依「每抽價格」比較。<br>
同時顯示層數換算值供參考；不同品牌的紙張厚度、尺寸及材質可能不同，因此層數換算不代表實際紙量完全相同。
</div>

</div>


<script>

function getProduct(id){

  return {
    id:id,
    brand:document.getElementById("brand"+id).value,
    store:document.getElementById("store"+id).value,
    price:parseFloat(document.getElementById("price"+id).value),
    sheets:parseFloat(document.getElementById("sheets"+id).value),
    packs:parseFloat(document.getElementById("packs"+id).value),
    layers:parseFloat(document.getElementById("layers"+id).value)
  };

}


function valid(p){

  return (
    p.brand !== "" &&
    p.store !== "" &&
    Number.isFinite(p.price) &&
    Number.isFinite(p.sheets) &&
    Number.isFinite(p.packs) &&
    Number.isFinite(p.layers) &&
    p.price > 0 &&
    p.sheets > 0 &&
    p.packs > 0 &&
    p.layers > 0
  );

}


function compareProducts(){

  var result = document.getElementById("result");

  var products = [
    getProduct("A"),
    getProduct("B"),
    getProduct("C")
  ];

  for(var i=0;i<products.length;i++){

    if(!valid(products[i])){

      result.style.display="block";

      result.innerHTML =
      '<div class="error">' +
      '請把商品 A、B、C 的品牌、通路、售價、抽數、包數及層數全部填寫完成。' +
      '</div>';

      result.scrollIntoView({behavior:"smooth"});

      return;
    }
  }


  for(var j=0;j<products.length;j++){

    var p = products[j];

    p.totalSheets = p.sheets * p.packs;

    p.costPerSheet =
      p.price / p.totalSheets;

    p.layerReference =
      p.price / (p.totalSheets * p.layers);

    p.costPerPack =
      p.price / p.packs;
  }


  products.sort(function(a,b){
    return a.costPerSheet - b.costPerSheet;
  });


  var winner = products[0];

  var html =
    '<div class="winner">' +
    '🏆 每抽價格最低：商品 ' +
    winner.id +
    '<br>' +
    winner.brand +
    '｜' +
    winner.store +
    '</div>';


  for(var k=0;k<products.length;k++){

    var x = products[k];

    var medal =
      k===0 ? "🥇" :
      k===1 ? "🥈" : "🥉";

    html +=
      '<div class="result-item">' +

      '<div class="rank">' +
      medal +
      ' 第 ' +
      (k+1) +
      ' 名 — 商品 ' +
      x.id +
      '</div>' +

      '<strong>' +
      x.brand +
      '</strong>｜' +
      x.store +

      '<br>售價：$' +
      x.price.toFixed(2) +

      '<br>規格：' +
      x.sheets +
      ' 抽 × ' +
      x.packs +
      ' 包 × ' +
      x.layers +
      ' 層' +

      '<br>每包：約 $' +
      x.costPerPack.toFixed(2) +

      '<br><strong>每抽：約 $' +
      x.costPerSheet.toFixed(4) +
      '</strong>' +

      '<br>層數換算參考：約 $' +
      x.layerReference.toFixed(5) +

      '</div>';
  }


  result.innerHTML = html;
  result.style.display = "block";

  result.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


function resetAll(){

  var ids = ["A","B","C"];

  for(var i=0;i<ids.length;i++){

    var id = ids[i];

    document.getElementById("brand"+id).value="";
    document.getElementById("store"+id).value="";
    document.getElementById("price"+id).value="";
    document.getElementById("sheets"+id).value="";
    document.getElementById("packs"+id).value="";
    document.getElementById("layers"+id).value="";
  }

  var result=document.getElementById("result");

  result.innerHTML="";
  result.style.display="none";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


document.getElementById("compareBtn").onclick =
compareProducts;

document.getElementById("resetBtn").onclick =
resetAll;

</script>

</body>
</html>
