<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>衛生紙比價神器</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 28px 18px 60px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 28px;
      font-size: 17px;
      line-height: 1.6;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 22px;
      margin-bottom: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 27px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 18px;
    }

    input,
    select {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 14px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: 2px solid #1976d2;
      border-color: #1976d2;
    }

    button {
      width: 100%;
      padding: 19px;
      border: none;
      border-radius: 18px;
      background: #1976d2;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .result {
      display: none;
      background: white;
      margin-top: 25px;
      padding: 24px;
      border-radius: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .winner {
      background: #e8f5e9;
      padding: 18px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .product-result {
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
    }

    .product-result:last-child {
      border-bottom: none;
    }

    .product-result h3 {
      margin-top: 0;
      font-size: 22px;
    }

    .product-result p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #1976d2;
    }

    .store {
      font-weight: bold;
    }

    .note {
      color: #777;
      font-size: 14px;
      margin-top: 20px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .container {
        padding: 22px 16px 50px;
      }

      h1 {
        font-size: 30px;
      }

      .card {
        padding: 22px;
      }

      input,
      select {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🧻 衛生紙比價神器</h1>

  <div class="subtitle">
    不同抽數、包數、層數，也能公平比較
  </div>


  <!-- 商品 A -->

  <div class="card">

    <h2>商品 A</h2>

    <label for="storeA">購買通路</label>

    <select id="storeA">
      <option value="">請選擇通路</option>
      <option value="全聯">全聯</option>
      <option value="大全聯">大全聯</option>
      <option value="家樂福">家樂福</option>
      <option value="7-ELEVEN">7-ELEVEN</option>
      <option value="全家">全家</option>
      <option value="其他">其他</option>
    </select>

    <label for="nameA">商品名稱</label>

    <input
      id="nameA"
      type="text"
      placeholder="例如：五月花厚棒抽取式衛生紙"
    >

    <label for="priceA">售價（元）</label>

    <input
      id="priceA"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="例如：299"
    >

    <label for="sheetsA">每包抽數</label>

    <input
      id="sheetsA"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：100"
    >

    <label for="packsA">一串幾包</label>

    <input
      id="packsA"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：12"
    >

    <label for="layersA">幾層</label>

    <input
      id="layersA"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：3"
    >

  </div>


  <!-- 商品 B -->

  <div class="card">

    <h2>商品 B</h2>

    <label for="storeB">購買通路</label>

    <select id="storeB">
      <option value="">請選擇通路</option>
      <option value="全聯">全聯</option>
      <option value="大全聯">大全聯</option>
      <option value="家樂福">家樂福</option>
      <option value="7-ELEVEN">7-ELEVEN</option>
      <option value="全家">全家</option>
      <option value="其他">其他</option>
    </select>

    <label for="nameB">商品名稱</label>

    <input
      id="nameB"
      type="text"
      placeholder="例如：舒潔抽取式衛生紙"
    >

    <label for="priceB">售價（元）</label>

    <input
      id="priceB"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="例如：329"
    >

    <label for="sheetsB">每包抽數</label>

    <input
      id="sheetsB"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：110"
    >

    <label for="packsB">一串幾包</label>

    <input
      id="packsB"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：12"
    >

    <label for="layersB">幾層</label>

    <input
      id="layersB"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：3"
    >

  </div>


  <!-- 商品 C -->

  <div class="card">

    <h2>商品 C</h2>

    <label for="storeC">購買通路</label>

    <select id="storeC">
      <option value="">請選擇通路</option>
      <option value="全聯">全聯</option>
      <option value="大全聯">大全聯</option>
      <option value="家樂福">家樂福</option>
      <option value="7-ELEVEN">7-ELEVEN</option>
      <option value="全家">全家</option>
      <option value="其他">其他</option>
    </select>

    <label for="nameC">商品名稱</label>

    <input
      id="nameC"
      type="text"
      placeholder="例如：春風抽取式衛生紙"
    >

    <label for="priceC">售價（元）</label>

    <input
      id="priceC"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="例如：279"
    >

    <label for="sheetsC">每包抽數</label>

    <input
      id="sheetsC"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：90"
    >

    <label for="packsC">一串幾包</label>

    <input
      id="packsC"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：12"
    >

    <label for="layersC">幾層</label>

    <input
      id="layersC"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：3"
    >

  </div>


  <button id="compareButton" type="button">
    開始比價
  </button>


  <div id="result" class="result"></div>


  <div class="note">
    ※ 比價依輸入的售價與商品規格換算。
    實際商品內容、促銷價格及販售狀況請以各通路現場或官方資訊為準。
  </div>

</div>


<script>

function getProduct(letter) {

  const store =
    document.getElementById("store" + letter).value;

  const nameInput =
    document.getElementById("name" + letter).value.trim();

  const name =
    nameInput || ("商品 " + letter);

  const price =
    Number(document.getElementById("price" + letter).value);

  const sheets =
    Number(document.getElementById("sheets" + letter).value);

  const packs =
    Number(document.getElementById("packs" + letter).value);

  const layers =
    Number(document.getElementById("layers" + letter).value);


  if (
    !store ||
    !Number.isFinite(price) ||
    !Number.isFinite(sheets) ||
    !Number.isFinite(packs) ||
    !Number.isFinite(layers) ||
    price <= 0 ||
    sheets <= 0 ||
    packs <= 0 ||
    layers <= 0
  ) {
    return null;
  }


  const totalSheets =
    sheets * packs;

  const totalLayerSheets =
    totalSheets * layers;

  const pricePerPack =
    price / packs;

  const pricePer100 =
    (price / totalSheets) * 100;

  const pricePer1000Layer =
    (price / totalLayerSheets) * 1000;


  return {
    letter: letter,
    store: store,
    name: name,
    price: price,
    sheets: sheets,
    packs: packs,
    layers: layers,
    totalSheets: totalSheets,
    totalLayerSheets: totalLayerSheets,
    pricePerPack: pricePerPack,
    pricePer100: pricePer100,
    pricePer1000Layer: pricePer1000Layer
  };
}


function makeResult(product) {

  return `
    <div class="product-result">

      <h3>${escapeHTML(product.name)}</h3>

      <p>
        購買通路：
        <span class="store">
          ${escapeHTML(product.store)}
        </span>
      </p>

      <p>
        售價：NT$ ${product.price.toFixed(2)}
      </p>

      <p>
        規格：
        ${product.sheets.toLocaleString()} 抽 ×
        ${product.packs.toLocaleString()} 包 ×
        ${product.layers.toLocaleString()} 層
      </p>

      <p>
        總抽數：
        ${product.totalSheets.toLocaleString()} 抽
      </p>

      <p>
        每包：
        NT$ ${product.pricePerPack.toFixed(2)}
      </p>

      <p>
        每 100 抽：
        <span class="price">
          NT$ ${product.pricePer100.toFixed(2)}
        </span>
      </p>

      <p>
        每 1,000 層抽：
        <span class="price">
          NT$ ${product.pricePer1000Layer.toFixed(2)}
        </span>
      </p>

    </div>
  `;
}


function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function compareProducts() {

  const A = getProduct("A");
  const B = getProduct("B");
  const C = getProduct("C");


  if (!A || !B || !C) {

    alert(
      "請確認商品 A、商品 B、商品 C 都已選擇購買通路，並正確填寫售價、每包抽數、一串包數及層數。"
    );

    return;
  }


  const products = [A, B, C];


  products.sort(function(a, b) {

    return (
      a.pricePer1000Layer -
      b.pricePer1000Layer
    );

  });


  const cheapest =
    products[0];

  const second =
    products[1];


  let percent = 0;

  if (second.pricePer1000Layer > 0) {

    percent =
      (
        (
          second.pricePer1000Layer -
          cheapest.pricePer1000Layer
        )
        /
        second.pricePer1000Layer
      )
      * 100;
  }


  const result =
    document.getElementById("result");


  result.innerHTML = `

    <div class="winner">

      🏆 最划算：
      ${escapeHTML(cheapest.name)}

      <br>

      購買通路：
      ${escapeHTML(cheapest.store)}

      <br>

      每 1,000 層抽
      NT$ ${cheapest.pricePer1000Layer.toFixed(2)}

      <br>

      約比第二名便宜
      ${percent.toFixed(1)}%

    </div>

    ${products.map(makeResult).join("")}

  `;


  result.style.display =
    "block";


  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


document
  .getElementById("compareButton")
  .addEventListener(
    "click",
    compareProducts
  );


if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(error) {

          console.log(
            "Service Worker 註冊失敗：",
            error
          );

        });

    }
  );

}

</script>

</body>
</html>
