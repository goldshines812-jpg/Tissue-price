<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>衛生紙比價神器</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: #f5f7fa;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 28px 18px 60px;
}

h1 {
  font-size: 34px;
  margin: 0 0 8px;
}

.subtitle {
  color: #777;
  font-size: 18px;
  margin-bottom: 30px;
  line-height: 1.6;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 28px 24px;
  margin-bottom: 24px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.06);
}

h2 {
  margin-top: 0;
  margin-bottom: 25px;
  font-size: 28px;
}

label {
  display: block;
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
  margin-bottom: 9px;
}

input,
select {
  width: 100%;
  min-height: 58px;
  padding: 14px 16px;
  border: 1px solid #ccc;
  border-radius: 16px;
  background: white;
  font-size: 18px;
}

input:focus,
select:focus {
  outline: 2px solid #1976d2;
  border-color: #1976d2;
}

.compare-btn {
  width: 100%;
  border: 0;
  border-radius: 20px;
  padding: 20px;
  background: #1976d2;
  color: white;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
}

.compare-btn:active {
  transform: scale(0.99);
}

#result {
  display: none;
  margin-top: 25px;
}

.winner {
  color: #16823b;
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 24px;
  line-height: 1.5;
}

.result-item {
  padding: 18px 0;
  border-bottom: 1px solid #eee;
  line-height: 1.8;
  font-size: 18px;
}

.result-item:last-of-type {
  border-bottom: none;
}

.rank {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 5px;
}

.cost {
  font-size: 20px;
  font-weight: bold;
}

.error {
  background: #fff3f3;
  color: #b00020;
  border-radius: 14px;
  padding: 16px;
  line-height: 1.6;
  font-weight: bold;
}

.note {
  color: #777;
  font-size: 14px;
  line-height: 1.7;
  margin-top: 20px;
}

.reset-btn {
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 16px;
  background: #666;
  color: white;
  font-size: 18px;
  font-weight: bold;
  margin-top: 20px;
  cursor: pointer;
}

@media (max-width: 480px) {
  .container {
    padding: 22px 16px 50px;
  }

  h1 {
    font-size: 30px;
  }

  .card {
    padding: 24px 20px;
  }
}
</style>
</head>


<body>

<div class="container">

<h1>🧻 衛生紙比價神器</h1>

<div class="subtitle">
不同品牌、通路、抽數、包數、層數，一次換算比較
</div>


<!-- 商品 A -->

<div class="card">

<h2>商品 A</h2>

<label for="brandA">品牌</label>

<select id="brandA">
<option value="">請選擇品牌</option>
<option value="舒潔">舒潔</option>
<option value="五月花">五月花</option>
<option value="春風">春風</option>
<option value="得意">得意</option>
<option value="倍潔雅">倍潔雅</option>
<option value="柔情">柔情</option>
<option value="蒲公英">蒲公英</option>
<option value="唯潔雅">唯潔雅</option>
<option value="可麗舒">可麗舒</option>
<option value="Tempo 得寶">Tempo 得寶</option>
<option value="家樂福">家樂福</option>
<option value="全聯自有品牌">全聯自有品牌</option>
<option value="其他品牌">其他品牌</option>
</select>


<label for="storeA">購買通路</label>

<select id="storeA">
<option value="">請選擇通路</option>
<option value="全聯">全聯</option>
<option value="大全聯">大全聯</option>
<option value="家樂福">家樂福</option>
<option value="7-ELEVEN">7-ELEVEN</option>
<option value="全家">全家</option>
<option value="萊爾富">萊爾富</option>
<option value="OK超商">OK超商</option>
<option value="寶雅">寶雅</option>
<option value="屈臣氏">屈臣氏</option>
<option value="康是美">康是美</option>
<option value="好市多 Costco">好市多 Costco</option>
<option value="momo">momo</option>
<option value="蝦皮">蝦皮</option>
<option value="PChome">PChome</option>
<option value="其他通路">其他通路</option>
</select>


<label for="priceA">售價（元）</label>

<input
id="priceA"
type="number"
inputmode="decimal"
min="0"
step="0.01"
placeholder="例如：299"
>


<label for="sheetsA">每包抽數</label>

<input
id="sheetsA"
type="number"
inputmode="numeric"
min="1"
step="1"
placeholder="例如：100"
>


<label for="packsA">一串幾包</label>

<input
id="packsA"
type="number"
inputmode="numeric"
min="1"
step="1"
placeholder="例如：12"
>


<label for="layersA">層數</label>

<select id="layersA">
<option value="">請選擇層數</option>
<option value="2">2 層</option>
<option value="3">3 層</option>
<option value="4">4 層</option>
<option value="5">5 層</option>
<option value="6">6 層</option>
</select>

</div>
