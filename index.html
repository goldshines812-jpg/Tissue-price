<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>衛生紙比價神器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 28px 18px 60px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .subtitle {
      color: #777;
      font-size: 17px;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      padding: 26px 22px;
      border-radius: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 28px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 9px;
    }

    input,
    select {
      width: 100%;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 15px;
      font-size: 18px;
      background: white;
    }

    select {
      appearance: auto;
    }

    input:focus,
    select:focus {
      outline: 2px solid #1683e8;
      border-color: #1683e8;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 19px;
      font-size: 22px;
      font-weight: bold;
      background: #1683e8;
      color: white;
      cursor: pointer;
      margin-top: 5px;
    }

    button:active {
      transform: scale(0.99);
    }

    .result {
      display: none;
      background: white;
      margin-top: 24px;
      padding: 26px 22px;
      border-radius: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .winner {
      font-size: 26px;
      font-weight: bold;
      color: #11823b;
      margin-bottom: 20px;
    }

    .result-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
      line-height: 1.7;
      font-size: 17px;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .error {
      display: none;
      background: #fff3f3;
      color: #b00020;
      padding: 16px;
      border-radius: 14px;
      margin-top: 18px;
      line-height: 1.6;
    }

    .note {
      color: #777;
      font-size: 14px;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🧻 衛生紙比價神器</h1>

  <div class="subtitle">
    不同抽數、包數、層數，也能公平比較
  </div>


  <!-- 商品 A -->

  <div class="card">

    <h2>商品 A</h2>

    <label for="nameA">商品名稱</label>
    <input
      id="nameA"
      type="text"
      placeholder="例如：品牌 A"
    >

    <label for="storeA">購買通路</label>

    <select id="storeA">
      <option value="">請選擇通路</option>
      <option value="全聯">全聯</option>
      <option value="大全聯">大全聯</option>
      <option value="家樂福">家樂福</option>
      <option value="7-ELEVEN">7-ELEVEN</option>
      <option value="全家">全家</option>
      <option value="好市多">好市多</option>
      <option value="momo">momo</option>
      <option value="蝦皮">蝦皮</option>
      <option value="其他">其他</option>
    </select>

    <label for="priceA">售價（元）</label>
    <input
      id="priceA"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="例如：199"
    >

    <label for="sheetsA">每包抽數</label>
    <input
      id="sheetsA"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：100"
    >

    <label for="packsA">一串幾包</label>
    <input
      id="packsA"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：12"
    >

    <label for="layersA">幾層</label>
    <input
      id="layersA"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：3"
    >

  </div>


  <!-- 商品 B -->

  <div class="card">

    <h2>商品 B</h2>

    <label for="nameB">商品名稱</label>
    <input
      id="nameB"
      type="text"
      placeholder="例如：品牌 B"
    >

    <label for="storeB">購買通路</label>

    <select id="storeB">
      <option value="">請選擇通路</option>
      <option value="全聯">全聯</option>
      <option value="大全聯">大全聯</option>
      <option value="家樂福">家樂福</option>
      <option value="7-ELEVEN">7-ELEVEN</option>
      <option value="全家">全家</option>
      <option value="好市多">好市多</option>
      <option value="momo">momo</option>
      <option value="蝦皮">蝦皮</option>
      <option value="其他">其他</option>
    </select>

    <label for="priceB">售價（元）</label>
    <input
      id="priceB"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="例如：179"
    >

    <label for="sheetsB">每包抽數</label>
    <input
      id="sheetsB"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：90"
    >

    <label for="packsB">一串幾包</label>
    <input
      id="packsB"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：10"
    >

    <label for="layersB">幾層</label>
    <input
      id="layersB"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：3"
    >

  </div>


  <!-- 商品 C -->

  <div class="card">

    <h2>商品 C</h2>

    <label for="nameC">商品名稱</label>
    <input
      id="nameC"
      type="text"
      placeholder="例如：品牌 C"
    >

    <label for="storeC">購買通路</label>

    <select id="storeC">
      <option value="">請選擇通路</option>
      <option value="全聯">全聯</option>
      <option value="大全聯">大全聯</option>
      <option value="家樂福">家樂福</option>
      <option value="7-ELEVEN">7-ELEVEN</option>
      <option value="全家">全家</option>
      <option value="好市多">好市多</option>
      <option value="momo">momo</option>
      <option value="蝦皮">蝦皮</option>
      <option value="其他">其他</option>
    </select>

    <label for="priceC">售價（元）</label>
    <input
      id="priceC"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="例如：209"
    >

    <label for="sheetsC">每包抽數</label>
    <input
      id="sheetsC"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：110"
    >

    <label for="packsC">一串幾包</label>
    <input
      id="packsC"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：12"
    >

    <label for="layersC">幾層</label>
    <input
      id="layersC"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：3"
    >

  </div>


  <button id="compareBtn" type="button">
    開始比價
  </button>

  <div id="error" class="error"></div>

  <div id="result" class="result">

    <div id="winner" class="winner"></div>

    <div id="resultList"></div>

  </div>

  <div class="note">
    ※ 比價方式：以「每 1000 個單層抽取單位的成本」換算。
    層數越多，會納入計算，因此不同抽數、包數與層數也能比較。
  </div>

</div>


<script>

(function () {

  "use strict";


  function getNumber(id) {

    const value = Number(
      document.getElementById(id).value
    );

    return value;

  }


  function getText(id) {

    return document
      .getElementById(id)
      .value
      .trim();

  }


  function readProduct(letter) {

    const name =
      getText("name" + letter) ||
      "商品 " + letter;

    const store =
      getText("store" + letter) ||
      "未指定通路";

    const price =
      getNumber("price" + letter);

    const sheets =
      getNumber("sheets" + letter);

    const packs =
      getNumber("packs" + letter);

    const layers =
      getNumber("layers" + letter);


    if (
      !Number.isFinite(price) ||
      !Number.isFinite(sheets) ||
      !Number.isFinite(packs) ||
      !Number.isFinite(layers) ||
      price <= 0 ||
      sheets <= 0 ||
      packs <= 0 ||
      layers <= 0
    ) {

      throw new Error(
        "請完整填寫商品 " +
        letter +
        " 的售價、每包抽數、一串幾包與層數。"
      );

    }


    const totalSingleLayerUnits =
      sheets * packs * layers;


    const costPer1000 =
      price / totalSingleLayerUnits * 1000;


    const pricePerPack =
      price / packs;


    const pricePer100Sheets =
      price / (sheets * packs) * 100;


    return {

      letter: letter,

      name: name,

      store: store,

      price: price,

      sheets: sheets,

      packs: packs,

      layers: layers,

      totalSingleLayerUnits:
        totalSingleLayerUnits,

      costPer1000:
        costPer1000,

      pricePerPack:
        pricePerPack,

      pricePer100Sheets:
        pricePer100Sheets

    };

  }


  function money(value) {

    return Number(value).toFixed(2);

  }


  function compareProducts() {

    const errorBox =
      document.getElementById("error");

    const resultBox =
      document.getElementById("result");

    const winnerBox =
      document.getElementById("winner");

    const resultList =
      document.getElementById("resultList");


    errorBox.style.display = "none";
    resultBox.style.display = "none";

    errorBox.textContent = "";
    resultList.innerHTML = "";


    try {

      const products = [

        readProduct("A"),

        readProduct("B"),

        readProduct("C")

      ];


      products.sort(function (a, b) {

        return (
          a.costPer1000 -
          b.costPer1000
        );

      });


      const cheapest =
        products[0];


      winnerBox.textContent =
        "🏆 最划算：" +
        cheapest.name +
        "（" +
        cheapest.store +
        "）";


      products.forEach(
        function (product, index) {

          const item =
            document.createElement("div");

          item.className =
            "result-item";


          let ranking = "";

          if (index === 0) {

            ranking = "🥇";

          } else if (index === 1) {

            ranking = "🥈";

          } else {

            ranking = "🥉";

          }


          item.innerHTML =

            "<strong>" +
            ranking +
            " " +
            product.name +
            "</strong><br>" +

            "購買通路：" +
            product.store +
            "<br>" +

            "售價：$" +
            money(product.price) +
            "<br>" +

            "每包：" +
            product.sheets +
            " 抽<br>" +

            "包數：" +
            product.packs +
            " 包<br>" +

            "層數：" +
            product.layers +
            " 層<br>" +

            "每包價格：約 $" +
            money(product.pricePerPack) +
            "<br>" +

            "每 100 抽價格：約 $" +
            money(product.pricePer100Sheets) +
            "<br>" +

            "<strong>標準化成本：約 $" +
            money(product.costPer1000) +
            " / 1000 單層抽取單位</strong>";


          resultList.appendChild(item);

        }
      );


      resultBox.style.display =
        "block";


      resultBox.scrollIntoView({

        behavior: "smooth",

        block: "start"

      });


    } catch (error) {

      errorBox.textContent =
        error.message;

      errorBox.style.display =
        "block";

      errorBox.scrollIntoView({

        behavior: "smooth",

        block: "center"

      });

    }

  }


  document
    .getElementById("compareBtn")
    .addEventListener(
      "click",
      compareProducts
    );


})();

</script>

</body>
</html>
