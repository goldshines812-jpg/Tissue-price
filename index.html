<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>衛生紙比價神器 V2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: #f5f7fa;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 28px 18px 60px;
}

h1 {
  font-size: 32px;
  margin: 0 0 8px;
}

.subtitle {
  color: #777;
  font-size: 17px;
  margin-bottom: 25px;
  line-height: 1.6;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 25px 22px;
  margin-bottom: 22px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.06);
}

h2 {
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 25px;
}

label {
  display: block;
  font-size: 17px;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  min-height: 56px;
  padding: 13px 15px;
  border: 1px solid #ccc;
  border-radius: 15px;
  background: white;
  font-size: 17px;
}

input:focus,
select:focus {
  outline: 2px solid #1976d2;
  border-color: #1976d2;
}

.compare-btn {
  width: 100%;
  border: 0;
  border-radius: 20px;
  padding: 19px;
  background: #1976d2;
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

.compare-btn:active {
  transform: scale(0.99);
}

.reset-btn {
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 16px;
  background: #666;
  color: white;
  font-size: 18px;
  font-weight: bold;
  margin-top: 15px;
  cursor: pointer;
}

#result {
  display: none;
  margin-top: 24px;
}

.winner {
  color: #16823b;
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 20px;
  line-height: 1.5;
}

.result-item {
  padding: 18px 0;
  border-bottom: 1px solid #eee;
  line-height: 1.8;
  font-size: 17px;
}

.result-item:last-child {
  border-bottom: none;
}

.rank {
  font-size: 21px;
  font-weight: bold;
}

.cost {
  font-size: 19px;
  font-weight: bold;
}

.error {
  background: #fff3f3;
  color: #b00020;
  border-radius: 14px;
  padding: 16px;
  line-height: 1.6;
  font-weight: bold;
}

.note {
  color: #777;
  font-size: 14px;
  line-height: 1.7;
  margin-top: 20px;
}

.version {
  text-align: center;
  color: #999;
  font-size: 13px;
  margin-top: 25px;
}

@media (max-width: 480px) {
  .container {
    padding: 22px 16px 50px;
  }

  h1 {
    font-size: 29px;
  }

  .card {
    padding: 22px 19px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🧻 衛生紙比價神器 V2</h1>

<div class="subtitle">
不同品牌、通路、抽數、包數、層數，一次換算比較
</div>

<div id="products"></div>

<button type="button" id="compareBtn" class="compare-btn">
開始比價
</button>

<div id="result" class="card"></div>

<button type="button" id="resetBtn" class="reset-btn">
清除全部資料
</button>

<div class="note">
※ V2 比價方式：售價 ÷（每包抽數 × 包數 × 層數），
將不同抽數、包裝與層數換算成相同基準後比較。
<br><br>
「每抽價格」則不計層數，方便同時查看一般每抽成本。
</div>

<div class="version">
衛生紙比價神器 V2
</div>

</div>

<script>

/* ---------- 品牌 ---------- */

const brands = [
  "舒潔",
  "五月花",
  "春風",
  "得意",
  "倍潔雅",
  "柔情",
  "蒲公英",
  "唯潔雅",
  "可麗舒",
  "Tempo 得寶",
  "家樂福",
  "全聯自有品牌",
  "其他品牌"
];


/* ---------- 購買通路 ---------- */

const stores = [
  "全聯",
  "大全聯",
  "家樂福",
  "7-ELEVEN",
  "全家",
  "萊爾富",
  "OK超商",
  "寶雅",
  "屈臣氏",
  "康是美",
  "好市多 Costco",
  "momo",
  "蝦皮",
  "PChome",
  "其他通路"
];


/* ---------- 建立商品輸入區 ---------- */

const productContainer = document.getElementById("products");

["A","B","C"].forEach(function(id) {

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <h2>商品 ${id}</h2>

    <label for="brand${id}">品牌</label>

    <select id="brand${id}">
      <option value="">請選擇品牌</option>
      ${brands.map(b =>
        `<option value="${b}">${b}</option>`
      ).join("")}
    </select>

    <label for="store${id}">購買通路</label>

    <select id="store${id}">
      <option value="">請選擇通路</option>
      ${stores.map(s =>
        `<option value="${s}">${s}</option>`
      ).join("")}
    </select>

    <label for="price${id}">售價（元）</label>

    <input
      id="price${id}"
      type="number"
      inputmode="decimal"
      min="0.01"
      step="0.01"
      placeholder="例如：299"
    >

    <label for="sheets${id}">每包抽數</label>

    <input
      id="sheets${id}"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：100"
    >

    <label for="packs${id}">一串幾包</label>

    <input
      id="packs${id}"
      type="number"
      inputmode="numeric"
      min="1"
      step="1"
      placeholder="例如：12"
    >

    <label for="layers${id}">層數</label>

    <select id="layers${id}">
      <option value="">請選擇層數</option>
      <option value="2">2 層</option>
      <option value="3">3 層</option>
      <option value="4">4 層</option>
      <option value="5">5 層</option>
      <option value="6">6 層</option>
    </select>
  `;

  productContainer.appendChild(card);
});


/* ---------- 讀取商品 ---------- */

function getProduct(id) {

  const brand =
    document.getElementById("brand" + id).value;

  const store =
    document.getElementById("store" + id).value;

  const price =
    Number(document.getElementById("price" + id).value);

  const sheets =
    Number(document.getElementById("sheets" + id).value);

  const packs =
    Number(document.getElementById("packs" + id).value);

  const layers =
    Number(document.getElementById("layers" + id).value);

  return {
    id,
    brand,
    store,
    price,
    sheets,
    packs,
    layers
  };
}


/* ---------- 驗證資料 ---------- */

function isValid(p) {

  return (
    p.brand !== "" &&
    p.store !== "" &&
    Number.isFinite(p.price) &&
    Number.isFinite(p.sheets) &&
    Number.isFinite(p.packs) &&
    Number.isFinite(p.layers) &&
    p.price > 0 &&
    p.sheets > 0 &&
    p.packs > 0 &&
    p.layers > 0
  );
}


/* ---------- 開始比價 ---------- */

document
.getElementById("compareBtn")
.addEventListener("click", function() {

  const result =
    document.getElementById("result");

  const products = [
    getProduct("A"),
    getProduct("B"),
    getProduct("C")
  ];

  const invalid =
    products.filter(p => !isValid(p));

  if (invalid.length > 0) {

    result.style.display = "block";

    result.innerHTML = `
      <div class="error">
      請把商品 A、B、C 的資料全部填寫完成，
      包含品牌、購買通路、售價、抽數、包數與層數。
      </div>
    `;

    result.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

    return;
  }


  /* 計算成本 */

  products.forEach(function(p) {

    p.totalSheets =
      p.sheets * p.packs;

    p.totalLayerSheets =
      p.sheets * p.packs * p.layers;

    p.costPerSheet =
      p.price / p.totalSheets;

    p.costPerLayerSheet =
      p.price / p.totalLayerSheets;

    p.costPerPack =
      p.price / p.packs;
  });


  /* 依照層數換算後成本排序 */

  products.sort(function(a,b) {
    return a.costPerLayerSheet -
           b.costPerLayerSheet;
  });


  const winner = products[0];


  /* 顯示結果 */

  let html = `
    <div class="winner">
      🏆 最划算：商品 ${winner.id}<br>
      ${winner.brand}｜${winner.store}
    </div>
  `;


  products.forEach(function(p,index) {

    let medal = "";

    if (index === 0) medal = "🥇";
