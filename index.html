<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>衛生紙比價神器</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: #f5f7fa;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 28px 18px 60px;
}

h1 {
  font-size: 34px;
  margin-bottom: 5px;
}

.subtitle {
  color: #777;
  margin-bottom: 28px;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 24px;
  margin-bottom: 22px;
  box-shadow: 0 8px 25px rgba(0,0,0,.05);
}

.card h2 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 8px;
}

input {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 14px;
}

button {
  width: 100%;
  padding: 18px;
  margin-top: 10px;
  border: 0;
  border-radius: 16px;
  background: #1976d2;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

.result {
  display: none;
  background: #e8f5e9;
  padding: 24px;
  border-radius: 20px;
  margin-top: 24px;
}

.winner {
  font-size: 26px;
  font-weight: bold;
  color: #16883a;
  margin-bottom: 20px;
}

.price {
  font-size: 24px;
  font-weight: bold;
}

.note {
  color: #777;
  font-size: 14px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>🧻 衛生紙比價神器</h1>
<div class="subtitle">
不同抽數、包數、層數，也能公平比較
</div>

<div class="card">
<h2>商品 A</h2>

<label>商品名稱</label>
<input id="nameA" placeholder="例如：品牌 A">

<label>售價（元）</label>
<input id="priceA" type="number" inputmode="decimal">

<label>每包抽數</label>
<input id="sheetsA" type="number" inputmode="numeric">

<label>一串幾包</label>
<input id="packsA" type="number" inputmode="numeric">

<label>幾層</label>
<input id="layersA" type="number" inputmode="numeric">
</div>

<div class="card">
<h2>商品 B</h2>

<label>商品名稱</label>
<input id="nameB" placeholder="例如：品牌 B">

<label>售價（元）</label>
<input id="priceB" type="number" inputmode="decimal">

<label>每包抽數</label>
<input id="sheetsB" type="number" inputmode="numeric">

<label>一串幾包</label>
<input id="packsB" type="number" inputmode="numeric">

<label>幾層</label>
<input id="layersB" type="number" inputmode="numeric">
</div>
<div class="card">
  <h2>商品 C</h2>

  <label>商品名稱</label>
  <input id="nameC" placeholder="例如：品牌 C">

  <label>售價（元）</label>
  <input id="priceC" type="number" inputmode="decimal">

  <label>每包抽數</label>
  <input id="sheetsC" type="number" inputmode="numeric">

  <label>一串幾包</label>
  <input id="packsC" type="number" inputmode="numeric">

  <label>幾層</label>
  <input id="layersC" type="number" inputmode="numeric">
</div>
<button onclick="compareProducts()">開始比價</button>

<div id="result" class="result"></div>

<div class="note">
※ 比價依輸入的售價與商品規格換算，實際商品內容及售價請以賣場標示為準。
</div>

</div>

<script>
function getProduct(letter) {
  const name =
    document.getElementById("name" + letter).value.trim() ||
    "商品 " + letter;

  const price =
    Number(document.getElementById("price" + letter).value);

  const sheets =
    Number(document.getElementById("sheets" + letter).value);

  const packs =
    Number(document.getElementById("packs" + letter).value);

  const layers =
    Number(document.getElementById("layers" + letter).value);

  if (
    price <= 0 ||
    sheets <= 0 ||
    packs <= 0 ||
    layers <= 0
  ) {
    return null;
  }

  const totalSheets = sheets * packs;

  const pricePer100 =
    price / totalSheets * 100;

  const totalLayerSheets =
    totalSheets * layers;

  const pricePer1000Layer =
    price / totalLayerSheets * 1000;

  return {
    name,
    price,
    totalSheets,
    pricePer100,
    pricePer1000Layer
  };
}

function compareProducts() {

  const A = getProduct("A");
  const B = getProduct("B");
  const C = getProduct("C");

  if (!A || !B｜｜！C) {
    alert("請把商品 A、商品 B、商品C的售價、抽數、包數、層數都填完整。");
    return;
  }

  const result =
    document.getElementById("result");

  const products = [A, B, C];
products.sort((a, b) => a.pricePer1000Layer - b.pricePer1000Layer);

const cheapest = products[0];
const second = products[1];

const percent =
  ((second.pricePer1000Layer - cheapest.pricePer1000Layer) /
   second.pricePer1000Layer) * 100;

const winnerText =
  `🏆 ${cheapest.name} 最便宜，比第二便宜約 ${percent.toFixed(1)}%`;
  result.innerHTML = `
    <div class="winner">${winnerText}</div>

    <h3>${A.name}</h3>
    <p>總抽數：${A.totalSheets.toLocaleString()} 抽</p>
    <p>每 100 抽：
       <span class="price">
       NT$ ${A.pricePer100.toFixed(2)}
       </span>
    </p>
    <p>每 1,000 層抽：
       NT$ ${A.pricePer1000Layer.toFixed(2)}
    </p>

    <hr>

    <h3>${B.name}</h3>
    <p>總抽數：${B.totalSheets.toLocaleString()} 抽</p>
    <p>每 100 抽：
       <span class="price">
       NT$ ${B.pricePer100.toFixed(2)}
       </span>
    </p>
    <p>每 1,000 層抽：
       NT$ ${B.pricePer1000Layer.toFixed(2)}
    </p>
    <hr>

<h3>${C.name}</h3>
<p>總抽數：${C.totalSheets.toLocaleString()} 抽</p>

<p>每 100 抽：
  <span class="price">
    NT$ ${C.pricePer100.toFixed(2)}
  </span>
</p>

<p>每 1,000 層抽：
  NT$ ${C.pricePer1000Layer.toFixed(2)}
</p>
  `;

  result.style.display = "block";
}
</script>

</body>
</html>
