<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>衛生紙比價神器</title>
<link rel="manifest" href="manifest.json">
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: #f5f7fa;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 28px 18px 60px;
}

h1 {
  font-size: 34px;
  margin-bottom: 5px;
}

.subtitle {
  color: #777;
  margin-bottom: 28px;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 22px;
  margin-bottom: 22px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.card h2 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  border: 1px solid #ccc;
  border-radius: 14px;
}

button {
  width: 100%;
  padding: 19px;
  border: none;
  border-radius: 18px;
  background: #1976d2;
  color: white;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  display: none;
  background: white;
  margin-top: 25px;
  padding: 24px;
  border-radius: 22px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
}

.winner {
  background: #e8f5e9;
  padding: 16px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 20px;
}

.price {
  font-size: 22px;
  font-weight: bold;
  color: #1976d2;
}

.note {
  color: #777;
  font-size: 14px;
  margin-top: 20px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>🧻 衛生紙比價神器</h1>

<div class="subtitle">
不同抽數、包數、層數，也能公平比較
</div>

<div class="card">
<h2>商品 A</h2>
<label>商品名稱</label>
<input id="nameA" type="text" placeholder="例如：品牌 A">
<label>購買通路</label>
<select id="storeA">
  <option value="">請選擇通路</option>
  <option value="全聯">全聯</option>
  <option value="大全聯">大全聯</option>
  <option value="家樂福">家樂福</option>
  <option value="7-ELEVEN">7-ELEVEN</option>
  <option value="全家">全家</option>
</select>


  

<label>售價（元）</label>
<input id="priceA" type="number" inputmode="decimal">

<label>每包抽數</label>
<input id="sheetsA" type="number" inputmode="numeric">

<label>一串幾包</label>
<input id="packsA" type="number" inputmode="numeric">

<label>幾層</label>
<input id="layersA" type="number" inputmode="numeric">
</div>


<div class="card">
<h2>商品 B</h2>

<label>商品名稱</label>
<input id="nameB" type="text" placeholder="例如：品牌 B">
<label>購買通路</label>
<select id="storeB">
  <option value="">請選擇通路</option>
  <option value="全聯">全聯</option>
  <option value="大全聯">大全聯</option>
  <option value="家樂福">家樂福</option>
  <option value="7-ELEVEN">7-ELEVEN</option>
  <option value="全家">全家</option>
</select>
  

<label>售價（元）</label>
<input id="priceB" type="number" inputmode="decimal">

<label>每包抽數</label>
<input id="sheetsB" type="number" inputmode="numeric">

<label>一串幾包</label>
<input id="packsB" type="number" inputmode="numeric">

<label>幾層</label>
<input id="layersB" type="number" inputmode="numeric">
</div>


<div class="card">
<h2>商品 C</h2>

<label>商品名稱</label>
<input id="nameC" type="text" placeholder="例如：品牌 C">
<label>購買通路</label>
<select id="storeC">
  <option value="">請選擇通路</option>
  <option value="全聯">全聯</option>
  <option value="大全聯">大全聯</option>
  <option value="家樂福">家樂福</option>
  <option value="7-ELEVEN">7-ELEVEN</option>
  <option value="全家">全家</option>
</select>
  
<label>售價（元）</label>
<input id="priceC" type="number" inputmode="decimal">

<label>每包抽數</label>
<input id="sheetsC" type="number" inputmode="numeric">

<label>一串幾包</label>
<input id="packsC" type="number" inputmode="numeric">

<label>幾層</label>
<input id="layersC" type="number" inputmode="numeric">
</div>


<button id="compareButton" type="button">
開始比價
</button>

<div id="result" class="result"></div>

<div class="note">
※ 比價依輸入的售價與商品規格換算，實際商品內容及售價請以賣場標示為準。
</div>

</div>


<script>

function getProduct(letter) {

  const nameInput =
    document.getElementById("name" + letter).value.trim();

  const name =
    nameInput || ("商品 " + letter);

  const price =
    Number(document.getElementById("price" + letter).value);

  const sheets =
    Number(document.getElementById("sheets" + letter).value);

  const packs =
    Number(document.getElementById("packs" + letter).value);

  const layers =
    Number(document.getElementById("layers" + letter).value);

  if (
    !Number.isFinite(price) ||
    !Number.isFinite(sheets) ||
    !Number.isFinite(packs) ||
    !Number.isFinite(layers) ||
    price <= 0 ||
    sheets <= 0 ||
    packs <= 0 ||
    layers <= 0
  ) {
    return null;
  }

  const totalSheets = sheets * packs;
const pricePerPack = price / packs;
  const pricePer100 =
    (price / totalSheets) * 100;

  const totalLayerSheets =
    totalSheets * layers;

  const pricePer1000Layer =
    (price / totalLayerSheets) * 1000;

  return {
    name: name,
    totalSheets: totalSheets,
    pricePerPack: pricePerPack,
    pricePer100: pricePer100,
    pricePer1000Layer: pricePer1000Layer
  };
}


function compareProducts() {

  const A = getProduct("A");
  const B = getProduct("B");
  const C = getProduct("C");

  if (!A || !B || !C) {
    alert("請把商品 A、商品 B、商品 C 的售價、抽數、包數、層數都填完整，而且數字必須大於 0。");
    return;
  }

  const products = [A, B, C];

  products.sort(function(a, b) {
    return a.pricePer1000Layer - b.pricePer1000Layer;
  });

  const cheapest = products[0];
  const second = products[1];

  const percent =
    ((second.pricePer1000Layer -
      cheapest.pricePer1000Layer) /
      second.pricePer1000Layer) * 100;

  const result =
    document.getElementById("result");

  result.innerHTML =
    '<div class="winner">🏆 ' +
    cheapest.name +
    ' 最便宜，比第二便宜約 ' +
    percent.toFixed(1) +
    '%</div>' +

    makeResult(A) +
    '<hr>' +
    makeResult(B) +
    '<hr>' +
    makeResult(C);

  result.style.display = "block";

  result.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


function makeResult(product) {

  return (
    '<h3>' + product.name + '</h3>' +
    '<p>總抽數：' +
    product.totalSheets.toLocaleString() +
    ' 抽</p>' +
'<p>每包：NT$ ' +
product.pricePerPack.toFixed(2) + '</p>' +
    '<p>每 100 抽：' +
    '<span class="price">NT$ ' +
    product.pricePer100.toFixed(2) +
    '</span></p>' +

    '<p>每 1,000 層抽：<span class="price">NT$ ' +
    product.pricePer1000Layer.toFixed(2) +
    '</span></p>'
  );
}


document
  .getElementById("compareButton")
  .addEventListener("click", compareProducts);

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
